name: APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Extract
        run: |
          rm -rf project
          mkdir project
          unzip -q HisseCoinTarayici_Android_APK_Uretim.zip -d project
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -1)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - name: Fix Kotlin plugin
        run: |
          FILE=$(find "$PROJECT_DIR" -path '*/app/build.gradle.kts' -type f | head -1)
          test -n "$FILE"
          sed -i 's/id("org.jetbrains.kotlin.android")/ /g' "$FILE"
          sed -i 's/compileSdk = 35/compileSdk = 36/g' "$FILE"
          sed -i 's/targetSdk = 35/targetSdk = 36/g' "$FILE"
          echo "--- app build file ---"
          sed -n '1,80p' "$FILE"
      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace